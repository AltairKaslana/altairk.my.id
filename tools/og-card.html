<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kartu OG altairk.my.id (sumber)</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#0D0B08;color:#F5F1EC;font-family:"Plus Jakarta Sans",sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:1200px;height:630px;padding:52px 72px 44px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.02em}
  .host{font-family:"JetBrains Mono",monospace;font-size:19px;color:#9A948B;letter-spacing:.04em}
  .body{display:grid;grid-template-columns:1fr 296px;gap:56px;align-items:end}
  h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:84px;line-height:1;letter-spacing:-.035em;max-width:15ch}
  h1 em{font-style:normal;color:#E4BE5B}
  .sub{margin-top:20px;font-size:24px;line-height:1.45;color:#BFBAB2;max-width:27ch}
  .row{display:flex;align-items:center;gap:14px;margin-top:26px}
  .chip{display:inline-flex;align-items:center;gap:12px;font-family:"JetBrains Mono",monospace;font-size:19px;padding:9px 18px 9px 9px;border-radius:8px;border:1px solid}
  .chip i{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:500;font-style:normal}
  .ytm{color:#F97316;border-color:rgba(249,115,22,.5);background:#211D19}
  .ytm i{background:#F97316;color:#241000}
  .zylo{color:#22D3EE;border-color:rgba(34,211,238,.5);background:#211D19}
  .zylo i{background:#22D3EE;color:#04222B}
  .meta{border-left:1px solid rgba(255,247,238,.13);padding-left:32px;display:flex;flex-direction:column;gap:16px;font-family:"JetBrains Mono",monospace;font-size:17px;line-height:1.25;color:#BFBAB2;white-space:nowrap}
  .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,247,238,.13);padding-top:34px;font-family:"JetBrains Mono",monospace;font-size:19px;color:#9A948B}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="brand">Altair</span>
      <span class="host">altairk.my.id</span>
    </div>
    <div class="body">
      <div>
        <h1>Aplikasi <em>kecil</em> yang kupakai tiap hari</h1>
        <p class="sub">Pemutar musik untuk HP lama, dan komputer gowes GPS.</p>
        <div class="row">
          <span class="chip ytm"><i>Y</i>YTM Relay</span>
          <span class="chip zylo"><i>Z</i>Zylo</span>
        </div>
      </div>
      <div class="meta">
        <span>Android 4.4 dan 6.0+</span>
        <span>Ekspor GPX untuk Strava</span>
        <span>Peta rute dan tanjakan</span>
        <span>Tanpa iklan</span>
        <span>APK dari GitHub Releases</span>
      </div>
    </div>
    <div class="foot"><span>Dimulai dari Xperia E1 di laci</span><span>Jawa Tengah</span></div>
  </div>
</body>
</html>
