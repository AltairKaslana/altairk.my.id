<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kartu OG altairk.my.id (sumber)</title>
<style>
  @font-face{font-family:"Plus Jakarta Sans";src:url("../assets/fonts/PlusJakartaSans-var.woff2") format("woff2");font-weight:400 700;font-style:normal}
  @font-face{font-family:"JetBrains Mono";src:url("../assets/fonts/JetBrainsMono-var.woff2") format("woff2");font-weight:400 500;font-style:normal}
  *{box-sizing:border-box;margin:0}
  body{background:#fbfbfd;color:#1d1d1f;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:1200px;height:630px;padding:56px 72px 44px;display:flex;flex-direction:column;justify-content:space-between;background:#fbfbfd}
  .top{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.085);padding-bottom:22px}
  .brand{font-weight:600;font-size:32px;letter-spacing:-.03em}
  .brand i{font-style:normal;color:#86868b}
  .host{font-family:"JetBrains Mono",monospace;font-size:18px;color:#86868b;letter-spacing:.02em}
  .body{display:grid;grid-template-columns:1fr 300px;gap:52px;align-items:end;flex:1;padding:44px 0 40px}
  h1{font-weight:600;font-size:82px;line-height:1;letter-spacing:-.045em;max-width:16ch}
  h1 em{font-style:normal;color:#0066cc}
  .sub{margin-top:22px;font-size:23px;line-height:1.45;color:#6e6e73;max-width:28ch}
  .row{display:flex;align-items:center;gap:12px;margin-top:30px}
  .chip{display:inline-flex;align-items:center;gap:11px;font-family:"JetBrains Mono",monospace;font-size:18px;padding:8px 16px 8px 8px;border-radius:9px;border:1px solid rgba(0,0,0,.085);background:#fff;color:#1d1d1f}
  .chip i{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:17px;font-weight:500;font-style:normal}
  .rylo i{background:#fbe9dc;color:#8a3f12}
  .zylo i{background:#dff3f7;color:#0b6070}
  .meta{border-left:1px solid rgba(0,0,0,.085);padding-left:30px;display:flex;flex-direction:column;gap:13px;font-family:"JetBrains Mono",monospace;font-size:16px;line-height:1.25;color:#6e6e73;white-space:nowrap}
  .foot{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid rgba(0,0,0,.085);padding-top:26px;font-family:"JetBrains Mono",monospace;font-size:17px;color:#86868b}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="brand">Altair<i>.</i></span>
      <span class="host">altairk.my.id</span>
    </div>
    <div class="body">
      <div>
        <h1>Musik dan gowes, tanpa iklan.</h1>
        <p class="sub">Relay YouTube Music untuk HP lama, dan komputer gowes GPS.</p>
        <div class="row">
          <span class="chip rylo"><i>R</i>Rylo</span>
          <span class="chip zylo"><i>Z</i>Zylo</span>
        </div>
      </div>
      <div class="meta">
        <span>Android 4.4 dan 6.0+</span>
        <span>10 metrik gowes</span>
        <span>Ekspor GPX</span>
        <span>Peta rute langsung</span>
        <span>APK dari GitHub</span>
      </div>
    </div>
    <div class="foot"><span>Dua aplikasi buatan sendiri</span><span>Jawa Tengah</span></div>
  </div>
</body>
</html>
